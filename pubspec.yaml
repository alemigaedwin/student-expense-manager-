name: student_expense_manager
description: "Student Expense Manager - track income, expenses, budgets, notes and reminders. Works on Android, iOS and Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2
  http: ^1.2.2

  # Remote database (via PHP backend on Hostinger)
  sqlbase: ^0.1.0

  # Local storage (works on Web via IndexedDB and on Android/iOS)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts (bar, pie, line)
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # Unique ids
  uuid: ^4.4.0

  # File / image attachments for "Add Bills"
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Export / share reports
  share_plus: ^10.1.0
  path_provider: ^2.1.3

  # Simple CSV report generation
  csv: ^6.0.0

  # Reports and authentication UI
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  crypto: ^3.0.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/app_logo.png
    - assets/category_icons/