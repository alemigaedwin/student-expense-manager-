name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK and Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Student Expense Manager v1.0.0 (Universal Release)' }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            ## 📱 Student Expense Manager — Multi-Platform Release

            ### 🤖 For Android Phones (Direct APK Install)
            👉 **[Download app-release.apk](https://github.com/alemigaedwin/student-expense-manager-/releases/download/v1.0.0/app-release.apk)**
            - Tap the download link on your phone.
            - Open the file and tap **Install** (Allow *"Install unknown apps"* if prompted).
            - Enjoy 100% offline access with automatic in-app updates!

            ---

            ### 🍎 For iPhones (iOS) & 💻 Windows / Mac
            👉 **[Open Live Web & PWA App](https://alemigaedwin.github.io/student-expense-manager-/)**
            - **iPhone**: Open in Safari, tap the **Share** button, and tap **"Add to Home Screen"** to install as a native offline app.
            - **Windows / Mac / PC**: Open in Chrome or Edge, click the **"Install App"** icon in the URL bar to install as an offline desktop application.

            ---

            ### ✨ Key Highlights
            - 📴 **100% Offline Mode**: Data is saved directly on your phone/device.
            - 🔄 **Automatic Updates**: App notifies you and updates directly from GitHub.
            - 💰 **Complete Financial Tools**: Expenses, income, budgets, notebook, reminders, and charts.
          files: |
            app-release.apk
