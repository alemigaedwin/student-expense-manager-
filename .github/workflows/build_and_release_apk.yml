name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK and Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Prepare APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-expense-manager-apk
          path: app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'v1.0.0'
          name: 'Student Expense Manager v1.0.0 (Release APK)'
          body: |
            ### 📱 Student Expense Manager Mobile App

            #### 📥 Download & Install on Android:
            - **Direct APK Download**: [Download app-release.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk)
            
            #### ⚡ How to Install:
            1. Download `app-release.apk` to your phone.
            2. Tap the file in your notification bar or **Downloads** folder.
            3. Tap **Install** (if prompted, enable *"Allow from this source"*).
            4. Launch and start tracking your student finances offline!

            #### 🔄 In-App Updates:
            This APK automatically checks this repository for newer versions and updates seamlessly.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app-release.apk
