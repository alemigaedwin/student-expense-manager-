name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK and Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-expense-manager-apk
          path: app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'v1.0.0'
          name: 'Student Expense Manager v1.0.0 (Release APK)'
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 Student Expense Manager — Android Release

            ### 🚀 Direct Download & Install APK:
            👉 **[Download app-release.apk](https://github.com/alemigaedwin/student-expense-manager-/releases/download/v1.0.0/app-release.apk)**

            ---

            ### ✨ Real Features
            - 📴 **100% Offline Mode**: All transactions, budgets, notes, and reminders are stored locally on your phone.
            - 🔄 **In-App Auto-Updates**: The app checks GitHub Releases for new updates automatically.
            - 💰 **Student Finances**: Full tracking for cash, cards, bank accounts, and budgets.
            - 📝 **Student Notebook**: Real notes and bill reminders.

            ---

            ### 📲 How to Install:
            1. Tap the download link above on your Android phone.
            2. Tap **Install** (Allow *"Install unknown apps"* if prompted).
            3. Open the app, create your account or sign in, and enjoy offline expense tracking!
          files: |
            app-release.apk
