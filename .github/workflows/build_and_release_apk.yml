name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK and Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Student Expense Manager - Latest Android APK' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Student Expense Manager - Android Release

            ### 🚀 Direct APK Download for Android Phones
            Click the link below on your phone to download and install the latest APK:
            👉 **[Download app-release.apk](https://github.com/alemigaedwin/student-expense-manager-/releases/latest/download/app-release.apk)**

            ---

            ### 🌟 Key Capabilities
            - 📴 **100% Offline Mode**: Complete local data storage on your phone. No internet required!
            - 🔄 **Automatic Over-The-Air Updates**: When you push new code to GitHub, users are automatically notified in the app to install updates.
            - 💰 **Expense & Income Tracking**: Record cash, bank, and mobile money transactions.
            - 📊 **Visual Analytics**: Interactive category breakdown, spending charts, and trends.
            - 🎯 **Budgets & Alerts**: Set category and overall monthly/weekly spending limits.
            - 📝 **Student Notebook & Reminders**: Keep bill reminders and notes.

            ---

            ### 📲 How to Install on Android
            1. Tap the **[Download app-release.apk](https://github.com/alemigaedwin/student-expense-manager-/releases/latest/download/app-release.apk)** link.
            2. Open the downloaded file from your browser or Downloads folder.
            3. Tap **Install** (If prompted, allow *"Install unknown apps"* for your browser/file manager).
            4. Open the app and tap **"Continue in Offline Mode"** to start immediately!
          files: |
            app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
